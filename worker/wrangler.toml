name = "adlnk-shortener"
main = "index.js"
compatibility_date = "2024-01-01"

# Bind a KV namespace called LINKS. Create it with:
#   wrangler kv namespace create LINKS
# then paste the id it prints below.
kv_namespaces = [
  { binding = "LINKS", id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID" }
]

# Restrict who can call POST /api/shorten from a browser.
# Set this to your site, e.g. "https://youradlnk.blogspot.com"
[vars]
CORS_ORIGIN = "*"

# Default (unset or "false"): links redirect instantly, like bit.ly - no
# ad-wait page, safe to run alongside Google AdSense on the same domain.
# Set to "true" to show the countdown/ad interstitial page instead (put
# PropellerAds/Adsterra code in it, never Google AdSense - see index.js).
SHOW_INTERSTITIAL = "false"

# Point your own domain at this Worker (after adding the domain to Cloudflare):
# [[routes]]
# pattern = "yourdomain.com/*"
# zone_name = "yourdomain.com"
